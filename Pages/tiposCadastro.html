<!DOCTYPE html>
<html data-responsive="Style tiposCadastro" lang="pt-br">

<head>
    <link rel="stylesheet" href="../Style/Style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escolha seu cadastro | IdeiaTech</title>


    <link rel="stylesheet" href="/Style/tiposCadastro.css">
    <script src="../Script/fluxoAutenticacao.js" defer></script>
    <link rel="stylesheet" href="../Style/acessoCarrinho.css">
    <link rel="stylesheet" href="/Style/responsivo.css">
    <script defer src="/Script/vendor/lucide.min.js"></script>
    <script defer src="/Script/icones.js"></script>
</head>

<body>
   

    <main class="cadastro-tipo">

        <!-- Logo -->
   

        <!-- Conteúdo principal -->
        <section class="conteudo">

            <div class="cabecalho">

                <h1>Crie sua conta</h1>

                <p>
                    Como você pretende utilizar o sistema?
                </p>

            </div>


            <!-- Opções de cadastro -->
            <div class="cards">

                <!-- Cliente -->
                <a data-link-autenticacao href="cadastroCliente.html" class="card card-cliente">

                    <div class="icone">
                        <i data-lucide="user"></i>
                    </div>

                    <div class="card-conteudo">

                        <h2> Sou cliente</h2>

                        <p>
                            Acompanhe seus serviços contratados,
                            seus pedidos e faça orçamentos,
                            tudo em tempo real.
                        </p>

                    </div>

                    <i 
                        class="seta"
                        data-lucide="arrow-right">
                    </i>

                </a>


                <!-- Administrador -->
                <a data-link-autenticacao href="cadastroEmpresa.html" class="card card-administrador">

                    <div class="icone">
                        <i data-lucide="building-2"></i>
                    </div>

                    <div class="card-conteudo">

                        <h2>Sou empresa</h2>

                        <p>
                            Cadastre sua empresa para apresentar seus serviços e acompanhar seus atendimentos.
                        </p>

                    </div>

                    <i 
                        class="seta"
                        data-lucide="arrow-right">
                    </i>

                </a>

            </div>


            <!-- Retorno para login -->
            <p class="login-link">
                Já possui uma conta?
                <a href="login.html" data-link-autenticacao>Entrar</a>
            </p>

        </section>

    </main>



</body>

</html>
