<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil | Ideia Tech</title>
    <link rel="stylesheet" href="../Style/Style.css">
    <link rel="stylesheet" href="../Style/auth-pages.css">
    <link rel="stylesheet" href="../Style/cadastroCliente.css">
    <link rel="stylesheet" href="/Style/mensagens.css">

</head>
<body>
    <main class="auth-layout">
        <aside class="auth-aside">
            <a href="index.html" class="auth-brand">Ideia Tech</a>

            <div class="auth-aside-copy">
                <h1>Seus dados atualizados.</h1>
                <p>Confira seu nome e telefone para facilitar o atendimento.</p>
            </div>
        </aside>

        <section class="auth-main">
            <div class="auth-panel auth-panel--cliente">
                <a href="Perfil.html" class="auth-back">Voltar ao perfil</a>

                <header class="auth-heading">
                    <h2>Editar perfil</h2>
                    <p>Atualize seu nome e telefone.</p>
                </header>

                {% include "_mensagens.html" %}

                {% if erro %}
                    <p class="auth-notice" role="alert">{{ erro }}</p>
                {% endif %}

                <!-- Essa tag acima é uma mensagem para aprecer somente quando der erro -->

                <form action="/Pages/editarPerfil.html"
                      method="POST"
                      class="auth-form">

                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token }}">
                           <!-- Esse value ajuda a proteger o formulario -->

                    <div class="form-field">
                        <label for="nome">Nome completo</label>
                        <input id="nome"
                               name="nome"
                               value="{{ usuario['nome'] }}"
                               minlength="3"
                               maxlength="120"
                               autocomplete="name"
                               required>
                    </div>

                    <!-- Value preenche o campo com o dado  -->

                    <div class="form-field">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel"
                               id="telefone"
                               name="telefone"
                               value="{{ usuario['telefone'] }}"
                               maxlength="20"
                               autocomplete="tel"
                               required>
                    </div>

                    <button type="submit" class="auth-submit">
                        Salvar alterações
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
