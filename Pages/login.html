<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/Style/login.css">
    <link rel="stylesheet" href="/Style/Style.css">

    <script src="https://unpkg.com/lucide@latest" async onload="window.lucide?.createIcons()"></script>


    <script src="../Script/fluxoAutenticacao.js" defer></script>
    <link rel="stylesheet" href="../Style/acessoCarrinho.css">
</head>

<body>
   

    <section class="slogan">

      


        <h1> Tecnologia que não te deixa no escuro</h1>

        <p> Acompanhe seus serviços contratados, seus pedidos e faça orçamentos,
            tudo em tempo real</p>

       
    </section>

    <section class="login-form">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <a href="recuperarSenha.html">Esqueceu sua senha?</a>

            <button type="submit">Entrar <i data-lucide="ArrowRight"></i> </button>
        </form>
        <div class="social-login">
            <p> Ou continue com </p>
            <div class="login-google">
                <a href="#"> <img src="../Assets/img/google.png" alt="Google Login">Google</a>
            </div>
            <div class="login-microsoft">
                <a href="#"> <img src="../Assets/img/microsoft.png" alt="microsoft Login">Microsoft</a>
            </div>
        </div>
        <p>Ainda não possui uma conta? <a href="tiposCadastro.html" data-link-autenticacao>Cadastre-se</a></p>

    </section>


    <footer>

        <p>Ideia Tech · Projeto desenvolvido no Senac DF · 2026</p>


    </footer>
</body>

</body>

<script>window.lucide?.createIcons();</script>

</html>
